name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., v0.1.4)'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release assets
        run: |
          RELEASE_NAME="melosso-theme-${{ github.event.inputs.version }}"
          mkdir -p $RELEASE_NAME
          cp -r images/ $RELEASE_NAME/images/
          cp README.md $RELEASE_NAME/README.md
          cp INSTALL.md $RELEASE_NAME/INSTALL.md
          cp theme-melosso.css $RELEASE_NAME/theme-melosso.css
          cp theme-melosso-dark.css $RELEASE_NAME/theme-melosso-dark.css
          cp theme-melosso-light.css $RELEASE_NAME/theme-melosso-light.css
          zip -r ${RELEASE_NAME}.zip $RELEASE_NAME

      - name: Generate Release Notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")

          echo "### What's Changed" > release_notes.md

          if [ -n "$PREV_TAG" ]; then
            git log ${PREV_TAG}..HEAD --no-merges --pretty=format:"* %s by @%an in %h" >> release_notes.md
          else
            git log --no-merges --pretty=format:"* %s by @%an in %h" >> release_notes.md
          fi

      - name: Create Tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body_path: release_notes.md
          files: melosso-theme-${{ github.event.inputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}