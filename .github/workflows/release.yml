name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., v0.1.4)'
        required: true
        type: string
      summary:
        description: 'Intro line for the release notes'
        required: false
        default: 'A minor release resolving various issues:'
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare release assets
        run: |
          RELEASE_NAME="melosso-theme-${{ github.event.inputs.version }}"
          mkdir -p $RELEASE_NAME
          cp -r images/ $RELEASE_NAME/images/
          cp README.md $RELEASE_NAME/README.md
          cp INSTALL.md $RELEASE_NAME/INSTALL.md
          cp theme-melosso.css $RELEASE_NAME/theme-melosso.css
          cp theme-melosso-dark.css $RELEASE_NAME/theme-melosso-dark.css
          cp theme-melosso-light.css $RELEASE_NAME/theme-melosso-light.css
          zip -r ${RELEASE_NAME}.zip $RELEASE_NAME

      - name: Generate Release Notes
        env:
          VERSION: ${{ github.event.inputs.version }}
          SUMMARY: ${{ github.event.inputs.summary }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          RANGE=${PREV_TAG:+$PREV_TAG..}HEAD
          LOG=$(git log "$RANGE" --no-merges --pretty=format:"%s")

          section() {
            local TITLE=$1; shift
            ITEMS=$(echo "$LOG" | { grep -E "$@" || true; } | sed '/^$/d; s/^/- [x] /')
            if [ -n "$ITEMS" ]; then
              printf '#### %s in `%s`:\n\n%s\n\n' "$TITLE" "$VERSION" "$ITEMS"
            fi
          }

          {
            printf '%s\n\n' "$SUMMARY"
            section "New" '^feat(\(.*\))?!?:'
            section "Fixes" '^fix(\(.*\))?!?:'
            section "Other changes" -v '^(feat|fix|chore|docs|ci)(\(.*\))?!?:'
            echo "Running into a compatibility problem or have a good suggestion? Please let us know by opening [an issue]($REPO_URL/issues)!"
            if [ -n "$PREV_TAG" ]; then
              printf '\n**Full Changelog**: %s/compare/%s...%s\n' "$REPO_URL" "$PREV_TAG" "$VERSION"
            fi
          } > release_notes.md
          cat release_notes.md

      - name: Create Tag
        run: |
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          body_path: release_notes.md
          files: melosso-theme-${{ github.event.inputs.version }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}